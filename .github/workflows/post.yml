name: Post to X
run-name: X post - ${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Exact text to publish (unchanged)'
        required: true
        type: string
      mode:
        description: 'validate checks setup without posting; post publishes once'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - post
permissions: {}
jobs:
  post:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install pinned X client
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir twikit==2.3.3 xclienttransaction==1.0.3
      - name: Validate or publish exact text
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        shell: bash
        run: |
          python3 - <<'PY'
          import asyncio
          import json
          import os
          import re
          import sys
          import traceback
          from pathlib import Path
          from twikit import Client
          from twikit.errors import NotFound
          from twikit.x_client_transaction.transaction import ClientTransaction
          from x_client_transaction.utils import get_ondemand_file_url
          from x_client_transaction.constants import INDICES_REGEX

          class CompatibleTransaction(ClientTransaction):
              async def get_indices(self, home_page_response, session, headers):
                  url = get_ondemand_file_url(home_page_response)
                  if not url.startswith('https://abs.twimg.com/responsive-web/client-web/ondemand.s.'):
                      raise ValueError('Unexpected asset host')
                  response = await session.get(url, headers=headers)
                  response.raise_for_status()
                  indices = [int(m.group(2)) for m in INDICES_REGEX.finditer(response.text)]
                  if len(indices) < 2:
                      raise Exception("Couldn't get KEY_BYTE indices")
                  return indices[0], indices[1:]

          def report(message):
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(message + chr(10))

          async def main():
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              inputs = event.get('inputs', {})
              text = inputs.get('text')
              mode = inputs.get('mode', 'validate')
              if not isinstance(text, str) or not text.strip():
                  report('FAILED: text must be a nonempty string. Nothing posted.')
                  return 1
              if mode not in ('validate', 'post'):
                  report('FAILED: invalid mode. Nothing posted.')
                  return 1
              if os.environ.get('GITHUB_RUN_ATTEMPT') != '1' and mode == 'post':
                  report('BLOCKED: reruns cannot publish; check X before a new dispatch.')
                  return 1
              try:
                  cookies = json.loads(os.environ.get('X_COOKIES_JSON', ''))
                  if not isinstance(cookies, dict):
                      raise ValueError()
                  for key in ('auth_token', 'ct0'):
                      if not isinstance(cookies.get(key), str) or not cookies[key]:
                          raise ValueError()
              except (ValueError, TypeError):
                  report('SETUP REQUIRED: set X_COOKIES_JSON with auth_token and ct0. Nothing posted.')
                  return 1
              client = Client('ja', timeout=30)
              client.client_transaction = CompatibleTransaction()
              try:
                  client.set_cookies(cookies)
                  for attempt in range(3):
                      try:
                          settings, _ = await client.v11.settings()
                          break
                      except NotFound:
                          if attempt == 2:
                              raise
                          await asyncio.sleep(2)
                  if settings.get('screen_name', '').lower() != 'akakarakawa':
                      raise ValueError('Unexpected X account')
                  if mode == 'validate':
                      report('X authentication verified. Nothing posted.')
                      return 0
                  result, _ = await client.gql.create_tweet(
                      False, text, [], None, None, None, None, False, None, None, None)
                  if result.get('errors'):
                      codes = [e.get('code') for e in result['errors']]
                      print('X error codes:', [c for c in codes if isinstance(c, int)])
                      raise ValueError('X rejected request')
                  tweet_id = str(result['data']['create_tweet']['tweet_results']['result']['rest_id'])
                  if not re.fullmatch(r'[0-9]+', tweet_id):
                      raise ValueError()
                  report('X accepted the post: https://x.com/i/status/' + tweet_id)
                  return 0
              except Exception as error:
                  name = type(error).__name__
                  for frame in traceback.extract_tb(error.__traceback__):
                      print(Path(frame.filename).name, frame.lineno, frame.name)
                  known = ("Couldn't get KEY_BYTE indices", "invalid response", "Couldn't get key from the page source")
                  if str(error) in known:
                      print(str(error))
                  report('POST NOT CONFIRMED (' + name + '). Check X before retrying; no automatic retry was made.')
                  return 1
              finally:
                  await client.http.aclose()

          sys.exit(asyncio.run(main()))
          PY
